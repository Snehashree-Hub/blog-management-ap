<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BlogFlow | Blog Management</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="hero">
    <div class="container">
      <span class="badge">FULL-STACK BLOG APP</span>
      <h1>BlogFlow</h1>
      <p>Create, manage, edit, and share your ideas in one place.</p>
    </div>
  </header>

  <main class="container layout">
    <section class="form-card">
      <div class="section-heading">
        <h2 id="form-title">Create a Blog</h2>
        <p>Fill in the details and publish your post.</p>
      </div>

      <form id="blog-form">
        <input type="hidden" id="blog-id">
        <label for="title">Blog title</label>
        <input id="title" type="text" maxlength="150" placeholder="Enter an engaging title" required>

        <label for="author">Author</label>
        <input id="author" type="text" maxlength="80" placeholder="Your name" required>

        <label for="content">Content</label>
        <textarea id="content" rows="8" placeholder="Write your blog content..." required></textarea>

        <div class="form-actions">
          <button class="primary" id="submit-btn" type="submit">Publish Blog</button>
          <button class="secondary hidden" id="cancel-btn" type="button">Cancel</button>
        </div>
      </form>
      <p id="message" class="message" role="status"></p>
    </section>

    <section class="blogs-section">
      <div class="list-header">
        <div>
          <h2>Latest Blogs</h2>
          <p id="blog-count">Loading...</p>
        </div>
      </div>
      <div id="blog-list" class="blog-grid"></div>
    </section>
  </main>

  <footer>Built with Flask, SQLite, HTML, CSS and JavaScript</footer>
  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
